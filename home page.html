<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion Store - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .hero {
      background: url('485f90e6-f849-4b11-b881-c015264385a1.png') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: white;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4); /* overlay for readability */
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-content h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
    }

    .hero-content button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      background: white;
      color: purple;
      border: 2px solid purple;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .hero-content button:hover {
      background: purple;
      color: white;
    }

    .categories {
      padding: 40px 20px;
      text-align: center;
    }

    .categories h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .category-list {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .category {
      padding: 15px 30px;
      background: white;
      border: 2px solid purple;
      border-radius: 5px;
      color: purple;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    .category:hover {
      background: purple;
      color: white;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-content">
      <h1>Welcome to Fashion Store</h1>
      <button onclick="location.href='products.html'">View All Products</button>
    </div>
  </div>

  <div class="categories">
    <h2>Shop by Category</h2>
    <div class="category-list">
      <a href="category.html" class="category">Tees</a>
      <span class="category">Jackets</span>
      <span class="category">Caps</span>
      <span class="category">Accessories</span>
      <span class="category">Limited</span>
    </div>
  </div>

</body>
</html>
